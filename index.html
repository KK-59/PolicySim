<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PolicySim — every policy runs in three worlds</title>
    <meta
      name="description"
      content="Upload the policy document you already wrote. It runs forward in three worlds, and you see which of your conclusions survive all three."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300..800;1,300..800&family=Fragment+Mono:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      THESIS: A policy result is a signal-or-noise judgement, not a number. This page refuses the
      KPI dashboard and the red/amber/green board paper: it shows the whole sampled distribution and
      says which conclusions survive all three worlds.
      OWN-WORLD: White sheet, near-black ink, one hairline rule system, no card shadows. Anima's
      blue-to-magenta gradient sampled at three points IS the uncertainty axis: optimistic #1D4ED8,
      realistic #0A0A0A, pessimistic #C026D3. Albert Sans for prose, Fragment Mono for every measured
      number and source tag, so provenance is visible before it is read.
      STORY: A planner sees their own document turned into sourced parameters, watches it run, and
      leaves knowing which claim holds and under what condition.
      FIRST VIEWPORT: One wide chart edge to edge, 120 sampled runs as grey ghost traces behind three
      struck world lines, a dashed line of no effect through zero. The finding sits beneath it in one
      sentence with its glyph. Primary action sits top-right of the chart and again beneath the finding.
      FORM: NHS 'Making Data Count' variation charts, candidate 3 of 7, seed key 9f20e4b7, rendered in
      the brief-pinned Anima material.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
